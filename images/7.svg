      <rect x="152" y="4" width="22" height="20" rx="3" stroke="#0E1116" stroke-width="4" fill="#E9EAEC"/>
      <path d="M174 14 L192 14" stroke="#0E1116" stroke-width="5"/>
      <path d="M42 0 L42 28 M72 0 L72 28 M102 0 L102 28" stroke="#0E1116" stroke-width="2.5" opacity=".6"/>
    </g>

    <!-- 주사기 2 -->
    <g transform="translate(72 176)">
      <path d="M-24 14 L-4 14" stroke="#0E1116" stroke-width="5"/>
      <rect x="-4" y="6" width="16" height="16" rx="2" stroke="#0E1116" stroke-width="4" fill="#E9EAEC"/>
      <rect x="12" y="0" width="140" height="28" rx="4" stroke="#0E1116" stroke-width="4" fill="#F2C230"/>
      <rect x="152" y="4" width="22" height="20" rx="3" stroke="#0E1116" stroke-width="4" fill="#E9EAEC"/>
      <path d="M174 14 L192 14" stroke="#0E1116" stroke-width="5"/>
      <path d="M42 0 L42 28 M72 0 L72 28 M102 0 L102 28" stroke="#0E1116" stroke-width="2.5" opacity=".6"/>
    </g>

    <!-- 주사기 3 -->
    <g transform="translate(72 268)">
      <path d="M-24 14 L-4 14" stroke="#0E1116" stroke-width="5"/>
      <rect x="-4" y="6" width="16" height="16" rx="2" stroke="#0E1116" stroke-width="4" fill="#E9EAEC"/>
      <rect x="12" y="0" width="140" height="28" rx="4" stroke="#0E1116" stroke-width="4" fill="#F2C230"/>
      <rect x="152" y="4" width="22" height="20" rx="3" stroke="#0E1116" stroke-width="4" fill="#E9EAEC"/>
      <path d="M174 14 L192 14" stroke="#0E1116" stroke-width="5"/>
      <path d="M42 0 L42 28 M72 0 L72 28 M102 0 L102 28" stroke="#0E1116" stroke-width="2.5" opacity=".6"/>
