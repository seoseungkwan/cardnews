    <path d="M286 98 L286 190" stroke="#8A6A00" stroke-width="4" stroke-dasharray="9 8"/>
    <path d="M286 190 L286 282" stroke="#8A6A00" stroke-width="4" stroke-dasharray="9 8"/>
