    <rect x="66" y="182" width="180" height="26" rx="4" fill="#F2C230" opacity=".7"/>
    <rect x="66" y="274" width="180" height="26" rx="4" fill="#F2C230" opacity=".7"/>
    <circle cx="428" cy="192" r="76" fill="#8A6A00" opacity=".35"/>

    <!-- 주사기 1 -->
    <g transform="translate(72 84)">
